name: Android release

# Chaque push sur main crée un APK signé, versionné, publié en release GitHub.
# L'app installée lit la dernière release et propose la mise à jour.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FLUTTER_VERSION: 3.41.4
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

      # versionCode = numéro du run : il augmente à chaque build, comme Android l'exige.
      - name: Version
        run: |
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 absent : l'APK ne pourrait pas mettre à jour l'app installée."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/babywatcher-release.jks
          {
            echo "storeFile=babywatcher-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name="$VERSION" --build-number="$BUILD_NUMBER"
          APK="babywatcher-$VERSION-arm64.apk"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "SHA256=$(sha256sum "$APK" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Nettoyage de la clé
        if: always()
        run: rm -f android/babywatcher-release.jks android/key.properties

      # Le message de commit passe par un fichier, jamais par interpolation shell.
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            git log -1 --pretty=%B
            echo
            echo "SHA-256 (arm64): \`$SHA256\`"
          } > notes.md
          gh release create "v$VERSION" "$APK" \
            --title "BabyWatcher $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
